# Builds the site with fresh game data and prices and publishes it on GitHub Pages.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
# Optional: Settings -> Secrets and variables -> Actions -> Variables -> POE_LEAGUE = league name.
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *' # prices every 6 hours
  workflow_dispatch:
    inputs:
      league:
        description: 'Лига для цен (пусто = определить автоматически)'
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh game data (RePoE)
        run: npm run data
        continue-on-error: true
      - name: Fetch prices (poe.ninja)
        run: npm run prices
        continue-on-error: true
        env:
          LEAGUE: ${{ inputs.league || vars.POE_LEAGUE }}
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
